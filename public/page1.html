  <script>
  const fileInput = document.getElementById("file");
  const box = document.getElementById("box");
  const count = document.getElementById("count");
  const next = document.getElementById("next");

  // Shared storage that survives navigation to another page even when these
  // files are opened directly from disk (file://), where plain localStorage
  // is siloed per-file and won't carry data from page1 to page2.
  const Store = {
    _read(){ try{ return JSON.parse(window.name || "{}"); }catch(e){ return {}; } },
    get(key){
      const v = this._read()[key];
      if(v !== undefined) return v;
      try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; }
    },
    set(key, value){
      const data = this._read();
      data[key] = value;
      window.name = JSON.stringify(data);
      try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
    }
  };

  // keep any images already saved (e.g. coming back from page2)
  let store = Store.get("store") || [];

  function renderSquares(){
    box.innerHTML = "";
    store.forEach((dataUrl, i)=>{
      const sq = document.createElement("div");
      sq.className = "square";
      sq.style.backgroundImage = `url("${dataUrl}")`;

      const remove = document.createElement("div");
      remove.className = "remove";
      remove.textContent = "x";
      remove.title = "Remove this image";
      remove.addEventListener("click",(e)=>{
        e.stopPropagation();
        store.splice(i,1);
        renderSquares();
      });

      sq.appendChild(remove);
      box.appendChild(sq);
    });
    count.textContent = `${store.length}`;
  }

  function addFiles(fileList){
    const files = Array.from(fileList);
    let remaining = files.length;
    if(!remaining) return;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = () => {
        store.push(reader.result); // base64 string
        remaining--;
        if(remaining === 0){
          Store.set("store", store);
          renderSquares();
        }
      };
      reader.readAsDataURL(file);
    });
  }

  fileInput.addEventListener("change", ()=>{
    addFiles(fileInput.files);
    fileInput.value = ""; // lets the same file be picked again later
  });

  next.addEventListener("click", ()=>{
    if(store.length === 0){
      alert("Add at least one picture first.");
      return;
    }
    Store.set("store", store);
    window.location.href = "page2.html";
  });

  renderSquares();

  // ---------------------------------------------------------------
  // "Your Books" - shows up to 6 stories pushed to the shop by
  // control.html. This page only reads the catalog, never writes it.
  // ---------------------------------------------------------------
  async function fetchBooks(){
    try{
      const res = await fetch("/api/books");
      if(!res.ok) return [];
      return await res.json();
    }catch(e){ console.error(e); return []; }
  }

  async function renderMyBooks(){
    const list = document.getElementById("myBooksList");
    if(!list) return;
    const books = (await fetchBooks()).slice(0, 6); // server already returns newest first
    if(!books.length){
      list.innerHTML = '<div class="noBooksMsg">No stories yet - start writing and they\'ll show up here!</div>';
      return;
    }
    list.innerHTML = "";
    books.forEach(book=>{
      const a = document.createElement("a");
      a.className = "bookThumb";
      a.href = `index.html?book=${encodeURIComponent(book._id)}`;

      const img = document.createElement("img");
      img.src = book.cover || "";
      a.appendChild(img);

      const span = document.createElement("span");
      span.textContent = book.title || "Untitled";
      a.appendChild(span);

      list.appendChild(a);
    });
  }
  renderMyBooks();
  </script>
