	  /* small "pointer" bubble: a tiny circle with a shrinking tail, used to
	     mark/point at a specific character in the picture */
	  .pointerMark{
	    position:absolute;
	    width:26px;height:26px;
	    border:2px solid var(--ink,#1a1a1a);
	    border-radius:50%;
	    background:white;
	    cursor:grab;
	    z-index:20;
	  }
	  .pointerMark::after{
	    content:"";
	    position:absolute;
	    bottom:-10px; left:2px;
	    width:0;height:0;
	    border:6px solid transparent;
	    border-top-color:white;
	  }
	  .pointerMark::before{
	    content:"";
	    position:absolute;
	    bottom:-13px; left:0px;
	    width:0;height:0;
	    border:8px solid transparent;
	    border-top-color:#1a1a1a;
	  }
	  /* draggable arrow that can be rotated to point toward a character */
	  .arrowMark{
	    position:absolute;
	    font-size:34px;
	    line-height:1;
	    color:#1a1a1a;
	    cursor:grab;
	    user-select:none;
	    z-index:20;
	  }

// Same cross-page shim as page1.html/page2.html - keeps data flowing
// between pages even when opened directly from disk (file://), where
// plain localStorage is siloed per-file.
const Store = {
  _read(){ try{ return JSON.parse(window.name || "{}"); }catch(e){ return {}; } },
  get(key){
    const v = this._read()[key];
    if(v !== undefined) return v;
    try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; }
  },
  set(key, value){
    const data = this._read();
    data[key] = value;
    window.name = JSON.stringify(data);
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }
};

// On phone-width screens, #canvasWrap is shrunk via CSS (aspect-ratio)
// while #canvas keeps its real 700x450 size - this scales the whole
// canvas (bubbles, fonts, images, everything) down as ONE proportional
// unit, instead of stretching the container and leaving fixed-pixel
// bubble text looking huge. Recomputed on load/resize since it depends
// on the wrapper's actual rendered width.
function fitCanvasScale(){
  if(!canvasWrap) return;
  const wrapWidth = canvasWrap.clientWidth;
  if(!wrapWidth){ return; }
  const scale = wrapWidth / 700;
  canvas.style.transform = scale < 0.999 ? `scale(${scale})` : "";
}
window.addEventListener("resize", fitCanvasScale);
window.addEventListener("load", fitCanvasScale);
fitCanvasScale();

// ---------- Pointer & Arrow marks ----------
// Small draggable marks you can place on top of the picture to point at
// a specific character. One pointer bubble + one rotatable arrow per
// character, saved/restored per page alongside everything else.
const extrasByChar = {
  1: { pointerBtn:document.getElementById("pointerBtn1"), arrowBtn:document.getElementById("arrowBtn1"), pointerId:"pointer1", arrowId:"arrow1" },
  2: { pointerBtn:document.getElementById("pointerBtn2"), arrowBtn:document.getElementById("arrowBtn2"), pointerId:"pointer2", arrowId:"arrow2" }
};

function makeDraggable(el){
  let dragging = false, offX = 0, offY = 0;
  el.addEventListener("mousedown",(e)=>{
    e.stopPropagation();
    selectedBox = el;
    dragging = true;
    el.style.cursor = "grabbing";
    offX = e.offsetX; offY = e.offsetY;
  });
  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;
    const rect = canvas.getBoundingClientRect();
    // rect reflects the visually-scaled size (shrunk on phone), but
    // left/top need to be in the canvas's real 700x450 coordinate
    // space - dividing by the current scale converts back to that.
    const scale = rect.width / 700;
    let left = (e.clientX - rect.left) / scale - offX / scale;
    let top = (e.clientY - rect.top) / scale - offY / scale;
    left = Math.max(0, Math.min(left, 700 - el.offsetWidth));
    top = Math.max(0, Math.min(top, 450 - el.offsetHeight));
    el.style.left = left + "px";
    el.style.top = top + "px";
  });
  document.addEventListener("mouseup",()=>{
    dragging = false;
    el.style.cursor = "grab";
  });
}

function createPointer(id){
  const el = document.createElement("div");
  el.id = id;
  el.className = "pointerMark";
  el.style.left = "80px";
  el.style.top = "80px";
  canvas.appendChild(el);
  makeDraggable(el);
  return el;
}

function createArrow(id){
  const el = document.createElement("div");
  el.id = id;
  el.className = "arrowMark";
  el.textContent = "➤";
  el.style.left = "80px";
  el.style.top = "80px";
  el.dataset.rot = "0";
  canvas.appendChild(el);
  makeDraggable(el);

  const rotateBtn = document.createElement("div");
  rotateBtn.className = "rotateHandle";
  rotateBtn.textContent = "↻";
  rotateBtn.addEventListener("mousedown",(e)=> e.stopPropagation());
  rotateBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    const rot = (parseInt(el.dataset.rot,10) + 45) % 360;
    el.dataset.rot = rot;
    el.style.transform = `rotate(${rot}deg)`;
  });
  el.appendChild(rotateBtn);
  rotateBtn.style.left = "-11px";
  rotateBtn.style.top = "-11px";
  return el;
}

Object.values(extrasByChar).forEach(({pointerBtn, arrowBtn, pointerId, arrowId})=>{
  pointerBtn.addEventListener("click",()=>{
    const existing = document.getElementById(pointerId);
    if(existing){ selectedBox = existing; return; }
    selectedBox = createPointer(pointerId);
  });
  arrowBtn.addEventListener("click",()=>{
    const existing = document.getElementById(arrowId);
    if(existing){ selectedBox = existing; return; }
    selectedBox = createArrow(arrowId);
  });
});

function extraState(id){
  const el = document.getElementById(id);
  if(!el) return null;
  return { left: el.style.left, top: el.style.top, rot: el.dataset.rot || "0" };
}

function restoreExtra(id, isArrow, state){
  const existing = document.getElementById(id);
  if(existing) existing.remove();
  if(!state) return;
  const el = isArrow ? createArrow(id) : createPointer(id);
  el.style.left = state.left;
  el.style.top = state.top;
  if(isArrow && state.rot){
    el.dataset.rot = state.rot;
    el.style.transform = `rotate(${state.rot}deg)`;
  }
}

// "PDF (no panels)" - one PDF page per story page, in order, with the
// photo and speech bubbles exactly as placed on the canvas. Works by
// screenshotting the actual #canvas element for each page, so whatever
// you see in the editor is exactly what lands in the PDF.
const pdfBtn = document.getElementById("pdfBtn");
pdfBtn.addEventListener("click", async ()=>{
  if(store.length === 0){
    alert("Add at least one picture first.");
    return;
  }
  pdfBtn.disabled = true;
  pdfBtn.textContent = "Building PDF...";
  const startedOn = pNum;
  savePage(pNum); // make sure the page you're currently on is saved too

  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:"landscape", unit:"px", format:[700,450] });

    for(let i=0;i<store.length;i++){
      loadPage(i);
      // give the browser a moment to actually paint the background image
      // and restored bubbles before we screenshot the canvas
      await new Promise(r=>setTimeout(r,120));
      const shot = await html2canvas(canvas, { backgroundColor:"#ffffff", width:700, height:450, scale:2, useCORS:true });
      const imgData = shot.toDataURL("image/jpeg",0.92);
      if(i>0) pdf.addPage([700,450],"landscape");
      pdf.addImage(imgData,"JPEG",0,0,700,450);
    }

    pdf.save("shortbook.pdf");
  }catch(err){
    console.error(err);
    alert("PDF export failed - check the browser console for details.");
  }finally{
    loadPage(startedOn);
    pdfBtn.disabled = false;
    pdfBtn.textContent = "⬇ Download PDF";
  }
});

// ---------------------------------------------------------------
// No download, no server route, no setup - uses whatever voices are
// already installed on your device/browser. "Play Story" walks every
// page in order and, on each page, reads Player 1's bubbles first,
// then Player 2's, before moving to the next page.
const player1VoiceSelect = document.getElementById("player1Voice");
const player2VoiceSelect = document.getElementById("player2Voice");
const playStoryBtn = document.getElementById("playStoryBtn");
const stopStoryBtn = document.getElementById("stopStoryBtn");
stopStoryBtn.disabled = true;

let allVoices = [];
let storyPlaying = false;
let stopRequested = false;
let voicesReady = false;

function fillVoiceSelect(selectEl, voices){
  selectEl.innerHTML = "";

  const isEnglish = (v) => v.lang && v.lang.toLowerCase().startsWith("en");
  const english = voices.filter(isEnglish);
  const others = voices.filter(v => !isEnglish(v));

  const addOption = (grp, v) => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    grp.appendChild(opt);
  };

  if(english.length){
    const grp = document.createElement("optgroup");
    grp.label = "English";
    english.forEach(v => addOption(grp, v));
    selectEl.appendChild(grp);
  }

  // Group whatever's left by language code, so different tones/accents
  // within the same language stay together.
  const byLang = {};
  others.forEach(v=>{
    const key = v.lang || "Other";
    (byLang[key] = byLang[key] || []).push(v);
  });
  Object.keys(byLang).sort().forEach(lang=>{
    const grp = document.createElement("optgroup");
    grp.label = lang;
    byLang[lang].forEach(v => addOption(grp, v));
    selectEl.appendChild(grp);
  });
}

// Some browsers (Chrome especially) load the voice list asynchronously
// and don't fire onvoiceschanged reliably, so we build the dropdowns
// immediately AND keep retrying for a few seconds until voices show up.
function populateVoiceLists(){
  allVoices = window.speechSynthesis.getVoices();
  if(!allVoices.length) return;
  voicesReady = true;

  // Remember whatever each player already had selected, so rebuilding
  // the list (which can fire more than once) doesn't stomp on a choice
  // you already made and bounce it back to the first/default voice.
  const prevPlayer1 = player1VoiceSelect.value;
  const prevPlayer2 = player2VoiceSelect.value;

  // Both players get the FULL list (every English tone/accent first,
  // then other languages) - so you can give Player 1 and Player 2
  // two different English voices, or switch either to another
  // language, instead of being locked into a fixed half-and-half split.
  fillVoiceSelect(player1VoiceSelect, allVoices);
  fillVoiceSelect(player2VoiceSelect, allVoices);

  if(prevPlayer1 && allVoices.some(v => v.name === prevPlayer1)){
    player1VoiceSelect.value = prevPlayer1;
  }
  if(prevPlayer2 && allVoices.some(v => v.name === prevPlayer2)){
    player2VoiceSelect.value = prevPlayer2;
  }
}

window.speechSynthesis.onvoiceschanged = populateVoiceLists;
populateVoiceLists();
let voiceRetries = 0;
const voiceRetryTimer = setInterval(()=>{
  if(voicesReady || voiceRetries > 20){ clearInterval(voiceRetryTimer); return; }
  voiceRetries++;
  populateVoiceLists();
}, 250);

// Speaks one chunk of text with the chosen voice, resolving when done
// (or immediately if there's nothing to say). Rate is slowed down
// below the default so it sounds like normal conversation instead of
// rushed/robotic.
function speak(text, voiceName){
  return new Promise((resolve)=>{
    if(!text || !text.trim()){ resolve(); return; }
    const utter = new SpeechSynthesisUtterance(text);
    const voice = allVoices.find(v => v.name === voiceName);
    if(voice) utter.voice = voice;
    utter.rate = 0.82;
    utter.onend = resolve;
    utter.onerror = resolve;
    window.speechSynthesis.speak(utter);
  });
}

function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Pulls the actual visible text out of the speech-bubble elements
// themselves (not the textarea) - whatever is really on screen. Only
// grabs the MOST RECENT bubble text in each box - if you've placed
// more than one bubble in the same spot over time, older ones can
// still be sitting in there too; this ignores those and only reads
// the last (current) one, so it doesn't read stale text. Returns the
// actual elements (not just strings) so the caller can highlight
// whichever bubble is currently talking.
function collectBubbles(ids){
  return ids
    .map(id => document.getElementById(id))
    .filter(el => el && el.lastElementChild)
    .map(el => ({ el, bubble: el.lastElementChild, text: (el.lastElementChild.textContent || "").trim() }))
    .filter(b => b.text.length > 0);
}

// Lights up whichever bubble is currently being spoken, and dims it
// back down once that line is done.
function setSpeaking(bubbleEl, isSpeaking){
  if(!bubbleEl) return;
  bubbleEl.classList.toggle("speakingBubble", isSpeaking);
}

function setEditingLocked(locked){
  player1.readOnly = locked;
  player2.readOnly = locked;
  [next, previous, del].forEach(btn => { if(btn) btn.disabled = locked; });
}

async function playStory(){
  if(storyPlaying) return;
  if(store.length === 0){
    alert("Add at least one page first - there's nothing to play yet.");
    return;
  }

  window.speechSynthesis.cancel(); // clear out anything stuck from before
  storyPlaying = true;
  stopRequested = false;
  playStoryBtn.disabled = true;
  stopStoryBtn.disabled = false;
  setEditingLocked(true); // story auto-flips pages while playing, so typing/navigating is paused until it's done or stopped

  // Chrome has a long-standing bug where speech silently pauses itself
  // after ~15 seconds. Nudging resume() periodically works around it
  // and is harmless on browsers that don't have the bug.
  const keepAlive = setInterval(()=>{
    if(window.speechSynthesis.speaking) window.speechSynthesis.resume();
  }, 4000);

  const startedOn = pNum;
  savePage(pNum); // make sure the page you're currently on is saved first
  let spokeAnything = false;

  try{
    for(let i=0; i<store.length; i++){
      if(stopRequested) break;
      loadPage(i); // restores this page's actual bubbles onto the canvas

      let saidSomethingOnThisPage = false;

      // Player 1's bubbles, in order (boxes1 -> boxes5), read from the
      // bubbles themselves - so multiple bubbles with different text
      // all get read, not just whatever's left in the textarea. Each
      // one lights up while it's being spoken, and there's a short
      // pause after so back-to-back lines don't run together.
      const player1Bubbles = collectBubbles(["boxes1","boxes2","boxes3","boxes4","boxes5"]);
      for(const b of player1Bubbles){
        if(stopRequested) break;
        spokeAnything = true;
        saidSomethingOnThisPage = true;
        setSpeaking(b.bubble, true);
        await speak(b.text, player1VoiceSelect.value);
        setSpeaking(b.bubble, false);
        if(stopRequested) break;
        await wait(450);
      }

      if(stopRequested) break;

      // Then Player 2's bubbles, same idea (newBox1 -> newBox5).
      const player2Bubbles = collectBubbles(["newBox1","newBox2","newBox3","newBox4","newBox5"]);
      for(const b of player2Bubbles){
        if(stopRequested) break;
        spokeAnything = true;
        saidSomethingOnThisPage = true;
        setSpeaking(b.bubble, true);
        await speak(b.text, player2VoiceSelect.value);
        setSpeaking(b.bubble, false);
        if(stopRequested) break;
        await wait(450);
      }

      // Silent pages get shown for a beat too, instead of instantly
      // flicking past them - keeps it feeling like a movie/slideshow
      // rather than randomly skipping pictures with no dialogue.
      if(!saidSomethingOnThisPage && !stopRequested){
        await wait(1200);
      }
    }
  } finally {
    clearInterval(keepAlive);
    loadPage(startedOn);
    storyPlaying = false;
    playStoryBtn.disabled = false;
    stopStoryBtn.disabled = true;
    setEditingLocked(false);
  }

  if(!spokeAnything && !stopRequested){
    alert("None of your pages have any speech bubbles on screen yet, so there's nothing to read aloud.");
  }
}

playStoryBtn.addEventListener("click", playStory);
stopStoryBtn.addEventListener("click", ()=>{
  stopRequested = true;
  window.speechSynthesis.cancel();
});
  </script>
</body>
</html>
