  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Segoe UI, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle, rgba(0,0,0,0.05) 1px, transparent 1.2px) 0 0/16px 16px,
        linear-gradient(160deg,#eef2f7,#dfe7ee 60%,#d8e2ec);
    }

    #cointener {
      margin-left: 340px;
      padding-bottom: 60px;
    }

    #canvas {
      border: 3px solid;
      height: 450px;
      width: 700px;
      border-radius: 15px;
      background-color: white;
    }

    /* IMAGE GRID */

    #box {
      position: absolute;
      top: 200px;
      right: 210px;

      display: grid;

      grid-template-columns: repeat(6, 130px);

      grid-auto-rows: 130px;

      gap: 23px;

      max-width: 770px;
    }

    /* EACH IMAGE */

    .square {
      border: 2px solid #2A6FDB;
      height: 130px;
      width: 130px;

      background-color: white;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      transition: transform .1s ease;

      position: relative;
    }
    .square:hover{
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.18);
    }

    /* DELETE X */

    .square .remove {
      position: absolute;

      top: -8px;
      right: -8px;

      width: 22px;
      height: 22px;

      border-radius: 50%;

      background: red;
      color: white;

      border: 2px solid white;

      font-weight: bold;
      font-size: 12px;

      line-height: 16px;

      cursor: pointer;

      display: none;
    }

    .square:hover .remove {
      display: block;
    }

    /* NEXT BUTTON */

    #next {
      position: absolute;

      width: 280px;
      height: 50px;

      border-radius: 10px;

      border: 1px solid;

      background-color: blue;

      border-color: green;

      font-weight: bold;

      color: white;

      top: 490px;
      right: 500px;

      font-size: 28px;

      cursor: pointer;
    }

    #next:hover {
      background-color: green;
      border-color: yellow;
    }

    h1 {
      color: lightgreen;
    }

    /* FILE */

    #file {
      height: 44px;
      padding: 8px 10px;
      color: #2A6FDB;
      background-color: white;
      border: 2px solid #2A6FDB;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;

      position: absolute;

      top: 300px;
      left: 365px;
    }

    /* IMAGE COUNT */

    #count {
      color: green;

      position: absolute;

      top: 200px;
      left: 365px;

      font-size: 25px;

      font-weight: bold;
    }

    /* DELETE BUTTONS */

    #clearRow {
      position: absolute;

      top: 430px;
      left: 365px;

      display: flex;

      gap: 20px;
    }

    #clear,
    #clear2 {
      height: 36px;

      padding: 0 14px;

      border-radius: 10px;

      border: 1px solid;

      font-weight: bold;

      cursor: pointer;
    }

  <script>

    const box =
      document.getElementById("box");

    const fileInput =
      document.getElementById("file");

    const count =
      document.getElementById("count");

    const clear =
      document.getElementById("clear");

    const clear2 =
      document.getElementById("clear2");

    const next =
      document.getElementById("next");


    /*
    =====================================
    STORAGE
    =====================================
    */

    const Store = {

      _read() {

        try {

          return JSON.parse(
            window.name || "{}"
          );

        }

        catch (e) {

          return {};

        }

      },


      get(key) {

        const data =
          this._read();

        const value =
          data[key];


        if (value !== undefined) {

          return value;

        }


        try {

          return JSON.parse(
            localStorage.getItem(key)
          );

        }

        catch (e) {

          return null;

        }

      },


      set(key, value) {

        const data =
          this._read();

        data[key] =
          value;


        window.name =
          JSON.stringify(data);


        try {

          localStorage.setItem(
            key,
            JSON.stringify(value)
          );

        }

        catch (e) {}

      }

    };


    /*
    =====================================
    GET IMAGES FROM PAGE 1
    =====================================
    */

    let store =
      Store.get("store") || [];


    /*
    =====================================
    DISPLAY IMAGES
    =====================================
    */

    function renderSquares() {

      box.innerHTML = "";


      store.forEach(
        (dataUrl, i) => {

          const square =
            document.createElement("div");


          square.className =
            "square";


          /*
          Put image inside square
          */

          square.style.backgroundImage =
            `url("${dataUrl}")`;


          /*
          DELETE BUTTON
          */

          const remove =
            document.createElement("div");


          remove.className =
            "remove";


          remove.textContent =
            "x";


          remove.title =
            "Remove this image";


          remove.addEventListener(
            "click",
            (event) => {

              event.stopPropagation();


              store.splice(i, 1);


              Store.set(
                "store",
                store
              );


              renderSquares();

            }
          );


          square.appendChild(
            remove
          );


          box.appendChild(
            square
          );

        }
      );


      /*
      Update image count
      */

      count.textContent =
        store.length;

    }


    /*
    =====================================
    UPLOAD MORE IMAGES
    =====================================
    */

    function addFiles(fileList) {

      const files =
        Array.from(fileList);


      let remaining =
        files.length;


      if (!remaining) {

        return;

      }


      files.forEach(
        (file) => {

          const reader =
            new FileReader();


          reader.onload =
            () => {

              store.push(
                reader.result
              );


              remaining--;


              if (
                remaining === 0
              ) {

                Store.set(
                  "store",
                  store
                );


                renderSquares();

              }

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }


    /*
    =====================================
    FILE INPUT
    =====================================
    */

    fileInput.addEventListener(
      "change",
      (event) => {

        addFiles(
          event.target.files
        );


        fileInput.value =
          "";

      }
    );


    /*
    =====================================
    DELETE LAST IMAGE
    =====================================
    */

    clear.addEventListener(
      "click",
      () => {

        if (store.length === 0) {

          return;

        }


        store.pop();


        Store.set(
          "store",
          store
        );


        renderSquares();

      }
    );


    /*
    =====================================
    DELETE FIRST IMAGE
    =====================================
    */

    clear2.addEventListener(
      "click",
      () => {

        if (store.length === 0) {

          return;

        }


        store.shift();


        Store.set(
          "store",
          store
        );


        renderSquares();

      }
    );


    /*
    =====================================
    NEXT PAGE
    =====================================
    */

    next.addEventListener(
      "click",
      () => {

        if (store.length === 0) {

          alert(
            "Add at least one picture first."
          );

          return;

        }


        Store.set(
          "store",
          store
        );


        window.location.href =
          "index.html";

      }
    );


    /*
    =====================================
    START
    =====================================
    */

    renderSquares();

  </script>
